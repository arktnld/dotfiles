# Hyprland config - migrado do bspwm

# Monitor
monitor=,preferred,auto,1

# Autostart
exec-once = waybar
exec-once = hyprpaper
exec-once = dunst
exec-once = nm-applet
exec-once = udiskie
exec-once = flameshot

# Env vars
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct

# Hardware acceleration (Intel UHD 620)
env = LIBVA_DRIVER_NAME,iHD
env = VDPAU_DRIVER,va_gl
env = MOZ_ENABLE_WAYLAND,1
env = MOZ_DISABLE_RDD_SANDBOX,1
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb

# Intel GPU optimizations
env = INTEL_DEBUG,noccs
env = ANV_QUEUE_THREAD_DISABLE,1

# Wayland/Hyprland specific
env = WLR_NO_HARDWARE_CURSORS,1
env = WLR_DRM_NO_ATOMIC,0

# Input
input {
    kb_layout = br
    kb_variant = abnt2
    kb_model = thinkpad
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0
}

# General
general {
    gaps_in = 5
    gaps_out = 15
    border_size = 2
    col.active_border = rgba(81A1C1ff) rgba(88C0D0ff) 45deg
    col.inactive_border = rgba(4C566Aff)
    layout = dwindle
}

# Decoration
decoration {
    rounding = 8
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

# Animations (reduzidas para performance)
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 3, myBezier
    animation = windowsOut, 1, 3, default, popin 80%
    animation = border, 0
    animation = borderangle, 0
    animation = fade, 1, 3, default
    animation = workspaces, 1, 3, default
}

# Layout
dwindle {
    pseudotile = true
    preserve_split = true
}

# Misc
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    vrr = 0
}

# Render settings (Intel UHD 620 optimized)
render {
    direct_scanout = true
}

# Keybinds
$mainMod = SUPER

# Apps
bind = $mainMod, Return, exec, ghostty
bind = $mainMod, space, exec, rofi -show drun -config ~/.config/rofi/config.rasi
bind = $mainMod, b, exec, qutebrowser
# super+d para dropdown é configurado no ghostty (keybind global)

# Window management
bind = $mainMod, w, killactive,
bind = $mainMod, f, fullscreen,
bind = $mainMod, t, togglefloating,
bind = $mainMod, s, togglesplit,
bind = $mainMod SHIFT, q, exit,

# Focus (vim-style)
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Move windows
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# Resize
bind = $mainMod ALT, h, resizeactive, -20 0
bind = $mainMod ALT, l, resizeactive, 20 0
bind = $mainMod ALT, k, resizeactive, 0 -20
bind = $mainMod ALT, j, resizeactive, 0 20

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Scroll workspaces
bind = $mainMod, bracketleft, workspace, e-1
bind = $mainMod, bracketright, workspace, e+1

# Mouse binds
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media keys
binde = , XF86AudioRaiseVolume, exec, amixer -q sset Master 5%+ unmute
binde = , XF86AudioLowerVolume, exec, amixer -q sset Master 5%- unmute
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

# Brightness
binde = , XF86MonBrightnessUp, exec, brightnessctl set +5%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Screenshot
bind = , Print, exec, flameshot gui

# Media controls
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Window rules for transparency/blur
windowrule {
    name = ghostty-noblur
    match:class = ^(com.mitchellh.ghostty)$
    no_blur = on
}

windowrule {
    name = code-opacity
    match:class = ^(Code|code-oss|VSCodium)$
    opacity = 0.9 override 0.9 override
}

# Layer rules
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0.5, match:namespace waybar
