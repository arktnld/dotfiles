;==========================================================
;   POLYBAR CONFIG - ThinkPad E480 Optimized
;==========================================================

[colors]
background = #282A2E
background-alt = #373B41
foreground = #C5C8C6
primary = #81A1C1
secondary = #88C0D0
accent = #A3BE8C
alert = #BF616A
warning = #EBCB8B
disabled = #4C566A
transparent = #00000000

[bar/top]
width = 100%
height = 30pt
radius = 8

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt
border-size = 4pt
border-color = #00000000

padding-left = 1
padding-right = 1
module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = JetBrainsMono Nerd Font:style=Medium:size=10;3
font-1 = Symbols Nerd Font:style=2048-em:size=13;3
font-2 = Font Awesome 6 Free:style=Solid:size=12;3
font-3 = Font Awesome 6 Brands:size=12;3
font-4 = DejaVu Sans:size=10;3

modules-left = xworkspaces
modules-center = date
modules-right = backlight pulseaudio wlan eth battery-combined

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
tray-position = right
tray-padding = 2
tray-maxsize = 14

wm-restack = bspwm

[bar/bottom]
bottom = true
width = 100%
height = 26pt
radius = 8

background = #00000000
foreground = ${colors.foreground}

line-size = 3pt
border-size = 4pt
border-color = #00000000

padding-left = 1
padding-right = 1
module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = JetBrainsMono Nerd Font:style=Medium:size=10;3
font-1 = Symbols Nerd Font:style=2048-em:size=13;3
font-2 = Font Awesome 6 Free:style=Solid:size=12;3
font-3 = Font Awesome 6 Brands:size=12;3
font-4 = DejaVu Sans:size=10;3

modules-left =
modules-center =
modules-right = loadavg temp-alert cpu-alert mem-alert disk-alert

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

wm-restack = bspwm

[module/xworkspaces]
type = internal/xworkspaces

label-active = ●
label-active-foreground = ${colors.accent}
label-active-padding = 1

label-occupied = ●
label-occupied-padding = 1
label-occupied-foreground = ${colors.primary}

label-urgent = ●
label-urgent-foreground = ${colors.alert}
label-urgent-padding = 1

label-empty = ○
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:50:...%
label-foreground = ${colors.secondary}

[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /
warn-percentage = 90

format-mounted = <label-mounted>
format-mounted-prefix = "󰋊 "
format-mounted-prefix-foreground = ${colors.accent}

label-mounted = %percentage_used%%
label-warn = %percentage_used%%
label-warn-foreground = ${colors.warning}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%

format-muted = <label-muted>
format-muted-prefix = "󰖁 "
format-muted-prefix-foreground = ${colors.disabled}
label-muted = muted
label-muted-foreground = ${colors.disabled}

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.accent}

click-right = pavucontrol &

[module/memory]
type = internal/memory
interval = 3
warn-percentage = 90

format = <label>
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.primary}

label = %percentage_used%%
label-warn = %percentage_used%%
label-warn-foreground = ${colors.warning}

[module/cpu]
type = internal/cpu
interval = 2
warn-percentage = 80

format = <label>
format-prefix = "󰘚 "
format-prefix-foreground = ${colors.primary}

label = %percentage%%
label-warn = %percentage%%
label-warn-foreground = ${colors.warning}

[module/cpu-temp]
type = internal/temperature
interval = 3
thermal-zone = 0
hwmon-path = /sys/devices/platform/coretemp.0/hwmon/hwmon7/temp1_input
base-temperature = 20
warn-temperature = 75

format = <ramp> <label>
format-warn = <ramp> <label-warn>

label = %temperature-c%
label-warn = %temperature-c%
label-warn-foreground = ${colors.alert}

ramp-0 = 󱃃
ramp-1 = 󰔏
ramp-2 = 󱃂
ramp-3 = 󰸁
ramp-foreground = ${colors.accent}

[module/wlan]
type = internal/network
interface-type = wireless
interval = 5

format-connected = <label-connected>
format-connected-prefix = "󰖩 "
format-connected-prefix-foreground = ${colors.accent}
label-connected = on

format-disconnected = <label-disconnected>
format-disconnected-prefix = "󰖪 "
format-disconnected-prefix-foreground = ${colors.disabled}
label-disconnected = off
label-disconnected-foreground = ${colors.disabled}

click-left = iwgtk &

[module/eth]
type = internal/network
interface-type = wired
interval = 5

format-connected = <label-connected>
label-connected = "󰈀"
label-connected-foreground = ${colors.accent}

format-disconnected =

[module/date]
type = internal/date
interval = 60

date = %d/%m
time = %H:%M
date-alt = %a %d %b %H:%M

format = <label>
format-prefix = "󰥔 "
format-prefix-foreground = ${colors.primary}
label = %date% %time%

[module/backlight]
type = internal/backlight
card = intel_backlight
enable-scroll = true

format = <ramp> <label>
label = %percentage%%

ramp-0 = 󰃞
ramp-1 = 󰃟
ramp-2 = 󰃠
ramp-foreground = ${colors.accent}

[module/battery-combined]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
poll-interval = 5

format-charging = <animation-charging> <label-charging>
label-charging = %percentage%% %consumption%W

format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%% %consumption%W

format-full = <label-full>
format-full-prefix = "󰂄 "
format-full-prefix-foreground = ${colors.accent}
label-full = Full

ramp-capacity-0 = 󰂎
ramp-capacity-0-foreground = ${colors.alert}
ramp-capacity-1 = 󰁺
ramp-capacity-1-foreground = ${colors.warning}
ramp-capacity-2 = 󰁻
ramp-capacity-3 = 󰁼
ramp-capacity-4 = 󰁽
ramp-capacity-5 = 󰁾
ramp-capacity-6 = 󰁿
ramp-capacity-7 = 󰂀
ramp-capacity-8 = 󰂁
ramp-capacity-9 = 󰂂
ramp-capacity-foreground = ${colors.accent}

animation-charging-0 = 󰢜
animation-charging-1 = 󰂆
animation-charging-2 = 󰂇
animation-charging-3 = 󰂈
animation-charging-4 = 󰢝
animation-charging-foreground = ${colors.accent}
animation-charging-framerate = 750

click-left = xfce4-power-manager-settings &

[module/loadavg]
type = custom/script
exec = ~/.config/polybar/custom_modules/loadavg.sh
interval = 5

[module/cpu-alert]
type = custom/script
exec = ~/.config/polybar/custom_modules/cpu-alert.sh
interval = 3

[module/mem-alert]
type = custom/script
exec = ~/.config/polybar/custom_modules/mem-alert.sh
interval = 5

[module/temp-alert]
type = custom/script
exec = ~/.config/polybar/custom_modules/temp-alert.sh
interval = 5

[module/disk-alert]
type = custom/script
exec = ~/.config/polybar/custom_modules/disk-alert.sh
interval = 30

[module/cava]
type = custom/script
exec = /home/arktnld/.config/polybar/custom_modules/cava.sh
tail = true
format = <label>
label = %output%
label-font = 5

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
